name: Continuous Integration

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/call_jira_sync.yml
      - .github/workflows/release.yml
      - README.md

  pull_request:
    paths-ignore:
      - .github/workflows/call_jira_sync.yml
      - .github/workflows/release.yml
      - README.md

env:
  IS_CICD: 1
  SCYLLA_VERSION: release:2025.2

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check formatting
        run: make check

  build-and-test:
    name: Build and Test (.NET ${{ matrix.dotnet-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [8.0.x]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - uses: astral-sh/setup-uv@v6

      - name: Restore
        run: dotnet restore ScyllaDB.Alternator.sln --verbosity minimal

      - name: Build
        run: make build

      - name: Pack and try installing NuGet package
        run: make try-get

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-dotnet-${{ matrix.dotnet-version }}
          path: nupkgs/*.nupkg

      - name: Run unit tests
        run: make test-unit

      - name: Upload unit test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-dotnet-${{ matrix.dotnet-version }}
          path: UnitTests/TestResults/**/*.trx

      - name: Run cluster infrastructure unit tests
        run: make test-infrastructure

      - name: Install pinned scylla-ccm
        run: make ccm-install

      - name: Cache Scylla relocatable package
        uses: actions/cache@v4
        with:
          path: ~/.ccm/scylla-repository
          key: scylla-ccm-relocatable-${{ runner.os }}-${{ runner.arch }}-${{ env.SCYLLA_VERSION }}

      - name: Run integration tests
        timeout-minutes: 20
        run: make test-integration

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results-dotnet-${{ matrix.dotnet-version }}
          path: IntegrationTests/TestResults/**/*.trx

      - name: Upload CCM diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccm-diagnostics-dotnet-${{ matrix.dotnet-version }}
          path: IntegrationTests/TestResults/ccm-runtime.*/diagnostics/**
          if-no-files-found: ignore
