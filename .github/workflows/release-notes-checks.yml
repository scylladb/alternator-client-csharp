name: Release notes checks
on:
  pull_request:
    paths: ['.github/**', 'scripts/release/**']
  push:
    branches: [main]
    paths: ['.github/**', 'scripts/release/**']
permissions:
  contents: read
jobs:
  release-notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix .github
      - run: node --test .github/tests/release-notes-guard.test.cjs
      - run: python3 -m unittest discover -s scripts/release -p test_github_release.py -v
