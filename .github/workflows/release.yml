name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: build package without pushing to NuGet'
        default: false

      skip-tests:
        type: boolean
        description: 'skip-tests: do not run tests while releasing'
        default: false

      target-tag:
        type: string
        description: 'target-tag: tag or branch name to release. Use to re-release tagged releases'
        default: main

      release-version:
        required: false
        type: string
        description: 'release-version: override package version'

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      actions: read
      contents: read
      issues: read

    outputs:
      package-artifact-id: ${{ steps.packages.outputs.artifact-id }}

    env:
      IS_CICD: 1
      RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
      RELEASE_VERSION: ${{ inputs.release-version }}
      RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
      MAKEFILE_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/guard.py check-environment

      - name: Block release with open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Preserve repository signing policy
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/release-policy/scripts/release"
          cp Makefile "$RUNNER_TEMP/release-policy/"
          cp scripts/release/signing.py scripts/release/guard.py scripts/release/publisher.asc "$RUNNER_TEMP/release-policy/scripts/release/"

      - name: Checkout selected release target
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target-tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout Code One Commit Before ${{ inputs.target-tag }}
        if: inputs.target-tag != 'main'
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" checkout-one-commit-before

      - name: Validate selected release target
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" check-target

      - name: Restore
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" run dotnet restore ScyllaDB.Alternator.sln --verbosity minimal

      - name: Build and check release artifacts
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-build

      - name: Upload validated packages
        id: packages
        uses: actions/upload-artifact@v4
        with:
          name: validated-packages-${{ github.run_attempt }}
          path: nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload sanitized validation logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs-${{ github.run_attempt }}
          path: /tmp/alternator-release-logs/*.log

  release:
    name: Sign and release
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      issues: read
      id-token: write

    env:
      IS_CICD: 1
      MAKEFILE_PATH: ${{ github.workspace }}
      PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/nupkgs

    steps:
      - name: Checkout trusted release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/guard.py check-environment

      - name: Download validated packages as data
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.validate.outputs.package-artifact-id }}
          path: nupkgs
          merge-multiple: true

      - name: Set up .NET for publication
        if: inputs.dry-run == false
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Sign and verify NuGet packages and checksums
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make release-sign

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Authenticate NuGet trusted publisher
        if: inputs.dry-run == false
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: scylladb.publish.code

      - name: Perform release
        if: inputs.dry-run == false
        env:
          NUGET_PUBLISH_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: make release-push

      - name: Perform release dry-run
        if: inputs.dry-run == true
        run: make release-dry-run-summary

      - name: Upload NuGet package
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nuget-package-${{ github.run_attempt }}
          path: |
            nupkgs/*.nupkg
            nupkgs/*.nupkg.asc
            nupkgs/SHA256SUMS
            nupkgs/SHA256SUMS.asc

      - name: Upload sanitized release logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs-${{ github.run_attempt }}
          path: /tmp/alternator-release-logs/*.log
