name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        type: boolean
        description: 'dry-run: build package without pushing to NuGet'
        default: false

      skip-tests:
        type: boolean
        description: 'skip project tests; build, formatting, and release-helper checks always run'
        default: false

      target-tag:
        type: string
        description: 'source branch/tag for dry runs; only main can publish new packages'
        default: main

      release-version:
        required: false
        type: string
        description: 'release-version: override package version'

      next-version:
        required: false
        type: string
        description: 'next numeric development version; defaults to the next patch with a dev suffix'

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      actions: read
      contents: read
      issues: read

    outputs:
      package-artifact-id: ${{ steps.packages.outputs.artifact-id }}
      source-sha: ${{ steps.source.outputs.source-sha }}
      source-ref: ${{ steps.source.outputs.source-ref }}
      source-ref-sha: ${{ steps.source.outputs.source-ref-sha }}
      release-version: ${{ steps.plan.outputs.version }}
      next-version: ${{ steps.plan.outputs.next-version }}
      release-tree: ${{ steps.plan.outputs.release-tree }}

    env:
      IS_CICD: 1
      RELEASE_SKIP_TESTS: ${{ inputs.skip-tests }}
      RELEASE_VERSION: ${{ inputs.release-version }}
      RELEASE_NEXT_VERSION: ${{ inputs.next-version }}
      RELEASE_TARGET_TAG: ${{ inputs.target-tag }}
      MAKEFILE_PATH: ${{ github.workspace }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/guard.py check-environment

      - name: Reject non-main package publication before preparation
        if: inputs.dry-run == false
        run: python3 scripts/release/guard.py check-publication-target

      - name: Test trusted release helpers
        run: make test-release-signing

      - name: Block release with open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Preserve repository signing policy
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/release-policy/scripts/release"
          cp Makefile "$RUNNER_TEMP/release-policy/"
          cp scripts/release/signing.py scripts/release/guard.py scripts/release/history.py scripts/release/github_release.py scripts/release/publisher.asc "$RUNNER_TEMP/release-policy/scripts/release/"

      - name: Checkout selected release target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target-tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x

      - name: Checkout Code One Commit Before ${{ inputs.target-tag }}
        if: inputs.target-tag != 'main'
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" checkout-one-commit-before

      - name: Validate selected release target
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" check-target

      - name: Record selected release source
        id: source
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" record-source >> "$GITHUB_OUTPUT"

      - name: Plan release versions and source tree
        id: plan
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/history.py" plan >> "$GITHUB_OUTPUT"

      - name: Restore
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" run dotnet restore ScyllaDB.Alternator.sln --verbosity minimal

      - name: Build and check release artifacts
        env:
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_NEXT_VERSION: ${{ steps.plan.outputs.next-version }}
          RELEASE_EXPECTED_TREE: ${{ steps.plan.outputs.release-tree }}
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-build

      - name: Upload validated packages
        id: packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-packages-${{ github.run_attempt }}
          path: nupkgs/*.nupkg
          if-no-files-found: error

      - name: Upload sanitized validation logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: validation-logs-${{ github.run_attempt }}
          path: /tmp/alternator-release-logs/*.log

  release:
    name: Sign and release
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30

    permissions:
      actions: read
      contents: write
      issues: read
      id-token: write

    env:
      IS_CICD: 1
      MAKEFILE_PATH: ${{ github.workspace }}
      PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/nupkgs
      RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.source-sha }}
      RELEASE_SOURCE_REF: ${{ needs.validate.outputs.source-ref }}
      RELEASE_SOURCE_REF_SHA: ${{ needs.validate.outputs.source-ref-sha }}
      RELEASE_BASE_COMMIT: ${{ needs.validate.outputs.source-sha }}
      RELEASE_VERSION: ${{ needs.validate.outputs.release-version }}
      RELEASE_NEXT_VERSION: ${{ needs.validate.outputs.next-version }}
      RELEASE_EXPECTED_TREE: ${{ needs.validate.outputs.release-tree }}

    steps:
      - name: Checkout trusted release tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate release environment protection
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/guard.py check-environment

      - name: Preserve trusted release tools
        run: |
          mkdir -m 700 -p "$RUNNER_TEMP/release-policy/scripts/release"
          cp Makefile "$RUNNER_TEMP/release-policy/"
          cp scripts/release/signing.py scripts/release/guard.py scripts/release/history.py scripts/release/github_release.py scripts/release/publisher.asc "$RUNNER_TEMP/release-policy/scripts/release/"

      - name: Fetch validated source without executing project code
        run: |
          [[ "$RELEASE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$RELEASE_SOURCE_SHA"
          git -c core.hooksPath=/dev/null checkout --detach "$RELEASE_SOURCE_SHA"

      - name: Reconstruct validated release plan
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/history.py" plan

      - name: Download validated packages as data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ needs.validate.outputs.package-artifact-id }}
          path: nupkgs
          merge-multiple: true

      - name: Set up .NET for publication
        if: inputs.dry-run == false
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 8.0.x

      - name: Check validated source before signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" check-source

      - name: Prepare signed release commits and tag
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-history

      - name: Verify prepared history with public key only
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-verify-history

      - name: Sign and verify NuGet packages and checksums
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-sign

      - name: Recheck for open release blockers
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          blocker=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label release-blocker \
            --limit 1 \
            --json title,url \
            --jq '.[0] // empty')
          if [[ -n "$blocker" ]]; then
            blocker_title=$(jq -r '.title' <<< "$blocker")
            blocker_url=$(jq -r '.url' <<< "$blocker")
            echo "Release blocked by open release blocker:"
            echo "${blocker_title} (${blocker_url})"
            exit 1
          fi

      - name: Check validated source before publication
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/guard.py" check-source

      - name: Validate GitHub release source before publication
        if: inputs.dry-run == false
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/github_release.py" check-source

      - name: Authenticate NuGet trusted publisher
        if: inputs.dry-run == false
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: scylladb.publish.code

      - name: Perform release
        if: inputs.dry-run == false
        env:
          NUGET_PUBLISH_TOKEN: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-push

      - name: Publish verified release history
        if: inputs.dry-run == false
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-push-history

      - name: Create GitHub release with filtered generated notes
        if: inputs.dry-run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 "$RUNNER_TEMP/release-policy/scripts/release/github_release.py"

      - name: Perform release dry-run
        if: inputs.dry-run == true
        run: make -f "$RUNNER_TEMP/release-policy/Makefile" release-dry-run-summary

      - name: Upload NuGet package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: nuget-package-${{ github.run_attempt }}
          path: |
            nupkgs/*.nupkg
            nupkgs/*.nupkg.asc
            nupkgs/SHA256SUMS
            nupkgs/SHA256SUMS.asc
            nupkgs/release-history.json
            nupkgs/release-history.json.asc
            nupkgs/release-history.bundle

      - name: Upload sanitized release logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: release-logs-${{ github.run_attempt }}
          path: /tmp/alternator-release-logs/*.log
